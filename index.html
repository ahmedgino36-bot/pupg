<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M7 ESPORTS</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: url("bg.jpg") no-repeat center center/cover;
    color: white;
    text-align: center;
}

.overlay {
    background: rgba(0,0,0,0.7);
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -1;
}

header {
    padding: 30px;
    animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(-30px);} 
    to {opacity:1; transform:translateY(0);} 
}

.logo {
    width: 160px;
    border-radius: 20px;
    box-shadow: 0 0 25px #00ffcc;
}

h1 {
    font-size: 55px;
    color: #00ffcc;
    text-shadow: 0 0 10px #00ffcc, 0 0 30px #00ffcc;
}

nav a {
    display: inline-block;
    margin: 8px;
    padding: 10px 15px;
    border: 1px solid #00ffcc;
    border-radius: 10px;
    color: white;
    text-decoration: none;
}

button {
    padding: 15px 30px;
    margin: 10px;
    background: #00ffcc;
    border: none;
    font-size: 16px;
    cursor: pointer;
    border-radius: 10px;
    font-weight: bold;
}

section {
    padding: 40px;
}

.card {
    background: #111;
    margin: 15px auto;
    padding: 20px;
    border-radius: 15px;
    max-width: 600px;
    box-shadow: 0 0 10px #00ffcc33;
}

.small-text {
    font-size: 14px;
    color: #aaa;
    margin-top: 20px;
}

video {
    width: 80%;
    max-width: 600px;
    margin-top: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px #00ffcc;
}

@media (max-width: 600px) {
    h1 {font-size: 30px;}
    .logo {width: 100px;}
}
</style>
</head>

<body>
<div class="overlay"></div>

<header>
<img src="logo.jpg" class="logo">
<h1>M7 ESPORTS</h1>
<p>نخبة لاعبي الـ E-Sports 🔥</p>

<nav>
<a href="#leaderboard">الترتيب</a>
<a href="#apply">التقديم</a>
</nav>

</header>

<!-- 🎥 INTRO VIDEO -->
<section>
<h2>🎬 Intro</h2>
<video controls autoplay muted>
<source src="M7.mp4" type="video/mp4">
</video>
</section>

<!-- 📊 LEADERBOARD -->
<section id="leaderboard">
<h2>📊 ترتيب اللاعبين</h2>

<div class="card">🥇 5586943854 - 【M7】SONIC¹ (Leader)</div>
<div class="card">🥈 5286443964 - 【M7】ICE¹</div>
<div class="card">🥉 5901651760 - 【M7】XaVI</div>

<p class="small-text">ORG SASA & GINO</p>

</section>

<!-- 📝 APPLY -->
<section id="apply">
<h2>📝 التقديم</h2>
<div class="card">
<form id="form">
<input type="text" id="id" placeholder="ID" required><br><br>
<input type="text" id="name" placeholder="اسم الحساب" required><br><br>
<input type="text" id="real" placeholder="اسمك" required><br><br>
<input type="number" id="age" placeholder="السن" required><br><br>
<input type="text" id="phone" placeholder="رقمك" required><br><br>
<select id="device">
<option>موبايل</option>
<option>آيباد</option>
<option>محاكي</option>
</select><br><br>
<input type="number" id="fps" placeholder="FPS"><br><br>
<input type="number" id="years" placeholder="سنين اللعب"><br><br>
<button type="submit">إرسال</button>
</form>
</div>
</section>

<script>
let phoneNumber = "201129730283";

document.getElementById("form").addEventListener("submit", function(e){
 e.preventDefault();
 let msg = `🔥 M7 ESPORTS طلب 🔥\n\nID: ${id.value}\nName: ${name.value}\nReal: ${real.value}\nAge: ${age.value}\nPhone: ${phone.value}\nDevice: ${device.value}\nFPS: ${fps.value}\nYears: ${years.value}`;
 let url = "https://wa.me/"+phoneNumber+"?text="+encodeURIComponent(msg);
 window.open(url,"_blank");
});
</script>

</body>
</html>
